name: Release

# Every push to `main` that carries a releasable commit produces a tag and a GitHub release. There is
# no pull request and no approval between the merge and the release, which is the design of semantic
# release: merging is publishing.
on:
  push:
    branches: [main]

# The only workflow here that writes. `contents` moves the tag and creates the release; the other two
# are what the GitHub release notes need when they link issues and pull requests.
permissions:
  contents: write
  issues: write
  pull-requests: write

# Not cancellable. A run interrupted between the tag and the release leaves a state the next run will
# not repair, because semantic release will not release the same commit twice.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Semantic release reads the whole history and the existing tags itself, and refuses to
          # work against a shallow clone.
          fetch-depth: 0
          # The changelog commit has to reach `main`, and that push is the only write this job does.
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      # Pinned rather than ranged: a release pipeline that changes version under itself is a release
      # pipeline nobody can reason about after the fact.
      - name: Install semantic release
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check \
            'python-semantic-release==10.7.0'
          semantic-release --version
      # `-c releaserc.toml` is not optional. Without it semantic release reads `pyproject.toml`,
      # finds nothing, and runs on its defaults while appearing to work.
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release -c releaserc.toml version
