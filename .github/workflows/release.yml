name: Release

# Every push to `main` that carries a releasable commit produces a tag and a GitHub release. There is
# no pull request and no approval between the merge and the release, which is the design of semantic
# release: merging is publishing.
#
# The shape of this file follows the action's own documented example, deliberately, so the two can be
# read side by side:
# https://python-semantic-release.readthedocs.io/en/stable/configuration/automatic-releases/github-actions.html
# What is left out of that example is everything for publishing a package, because nothing here is
# published anywhere: no distribution artifacts, no PyPI, and therefore no `id-token: write` either.
on:
  push:
    branches:
      - main

# Least privilege across every job in this workflow. The write is on the job that needs it, not here.
permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # On the job, not on the workflow, and named after the ref: two pushes to `main` in quick
    # succession must not race, and a release half way through must not be cancelled.
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # Check out the branch that triggered the workflow, not the default branch. On a push to `main`
      # they are the same today and would not be on any other branch that ever gets a release rule.
      - name: Setup | Checkout Repository on Release Branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}

      # Force the branch to be at the workflow's own sha. The branch may have moved while this run was
      # queued, and without this the releaser would sweep a push nobody judged into the release.
      - name: Setup | Force release branch to be at workflow sha
        run: |
          git reset --hard ${{ github.sha }}

      - name: Action | Semantic Version Release
        id: release
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The committer, not the author of the pull request. The tool's own default is
          # `semantic-release <semantic-release>`, which is not a GitHub account, so a release commit
          # would show up attributed to nobody. These are the identity values the action's
          # documentation uses, and they resolve to the GitHub Actions bot.
          git_committer_name: github-actions
          git_committer_email: actions@users.noreply.github.com
          # Without this the action looks for `pyproject.toml`, finds nothing, and runs on defaults
          # while appearing to work. There is no `pyproject.toml` here on purpose.
          config_file: releaserc.toml

      # The action's outputs make the run legible. A job whose only output is a container build log is
      # a job nobody can answer "did it release?" from.
      - name: Report | What was released
        if: always()
        env:
          RELEASED: ${{ steps.release.outputs.released }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          LINK: ${{ steps.release.outputs.link }}
        run: |
          if [ "$RELEASED" = true ]; then
            printf 'released %s as %s: %s\n' "$VERSION" "$TAG" "$LINK"
          else
            printf 'nothing releasable since the last tag; the line stays at %s\n' "${VERSION:-unknown}"
          fi
