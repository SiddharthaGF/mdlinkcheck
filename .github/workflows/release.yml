name: Release

# Merging accumulates. Publishing is a separate human decision.
#
# A push to `main` that carries a releasable change produces nothing: the preview job below works
# out what WOULD be released and writes it on a tracking issue. It creates no tag, no commit and no
# release, and it has no permission to. A maintainer reads the tracking issue and, when the work is
# worth releasing, dispatches this workflow by hand. The cut job then computes the version, hands it
# to `towncrier`, and lets the releaser tag it once.
#
#   | Run     | Trigger             | Writes to the repository |
#   | ------- | ------------------- | ------------------------ |
#   | preview | `push` to `main`    | nothing                  |
#   | cut     | `workflow_dispatch` | tag, changelog, release  |
#
# WHY THERE ARE NO RELEASE-CANDIDATE TAGS ANY MORE
#
# This flow used to mint a `v1.0.6-rc.1` on every releasable merge and finalize it on the cut. The
# tags turned out to be incompatible with a correct changelog, and not in a way a setting could fix:
# `python-semantic-release` builds its changelog by walking history and opening a section each time a
# commit carries a tag, so a tag IS a release boundary. The candidate tags were not releases and the
# tool could not tell. `v1.0.6-rc.1` and `v1.0.6-rc.2` sat on two of the three commits that v1.0.6
# contained; their entries were attributed to sections that are never published, and the published
# v1.0.6 changelog came out empty. The two candidate tags left in this repository's history are
# harmless: both are ancestors of `v1.0.6`, so they sit on the far side of the boundary.
#
# `towncrier` builds the changelog from the files in `newsfragments/` and never reads git history, so
# there is no boundary to get wrong. See towncrier.toml and .github/RELEASING.md.
#
# NEITHER JOB USES THE GITHUB ACTION
#
# The action was here because the preview job needed `--as-prerelease` and the action has no
# arbitrary-argument passthrough: its inputs are config_file, directory, github_token,
# git_committer_name, git_committer_email, no_operation_mode, ssh_public_signing_key,
# ssh_private_signing_key, strict, verbosity, prerelease, prerelease_token, force, commit, tag, push,
# changelog, vcs_release, build and build_metadata. GitHub Actions warns on an unrecognised input and
# continues, so passing one anyway produces a green run that does the wrong thing. The preview job no
# longer releases at all, so it does not need the flag, and with the asymmetry gone neither job has a
# reason to run a container to call a CLI that is already installed by the two lines below.
on:
  push:
    branches:
      - main
  # The cut. Dispatched by a maintainer from the Actions tab, on `main` — see .github/RELEASING.md.
  workflow_dispatch:

# Least privilege at the workflow level. Each job takes exactly the one grant it needs, and the two
# grants are different: only the cut can write to this repository.
permissions:
  contents: read

# ONE group for both jobs, named after the ref, so a preview and a cut can never overlap even if
# someone dispatches a cut while a push is still being previewed. `cancel-in-progress: false` is the
# other half: a release half way through must not be cancelled by the next event, which would leave a
# tag written and a release body missing.
concurrency:
  group: ${{ github.workflow }}-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preview:
    name: Preview
    # The push is the only thing that previews. Without this the dispatch would preview too, on a
    # branch that may hold no releasable commit at all.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # The ONLY thing this job can do is comment on the tracking issue. It has no `contents: write`,
      # so it cannot create a tag, a commit or a release even by accident — which is the point. The
      # preview is a read of the repository and a write to a conversation, and the permissions now say
      # exactly that. This is the job that used to hold `contents: write` and derived its own
      # version from a git tag diff; it no longer derives anything.
      issues: write
    steps:
      - name: Setup | Checkout Repository on Release Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # The version calculation needs the tags: it compares the computed version against the last
          # published one to decide whether there is anything to release at all. A shallow checkout
          # fetches no tags by default. `semantic-release` unshallows the repository when it runs —
          # that has been true since v10.5.0, which is why `fetch-depth: 0` is not set — but relying on
          # a side effect of the tool to notice a tag we already asked about is how the previous
          # version of this file came to report a release that never happened.
          fetch-tags: true

      # Force the branch to be at the workflow's own sha. The branch may have moved while this run was
      # queued, and the version reported would otherwise be one commit ahead of what was reviewed.
      - name: Setup | Force release branch to be at workflow sha
        run: |
          git reset --hard ${{ github.sha }}

      # The same pinned sha CI uses. Reusing it on purpose: one Python toolchain for the repository,
      # so a release cannot fail on a version nobody else runs.
      - name: Setup | Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      # Both tools are exact pins. This job holds `issues: write` rather than `contents: write`, so
      # the pin is not guarding a tag here; it is here so the preview a maintainer reads is the same
      # one the cut will produce, and a drifting dependency would make the preview a lie.
      - name: Setup | Install the release toolchain
        run: |
          python -m pip install "python-semantic-release==10.7.0" "towncrier==26.9.0"

      - name: Preview | What the next cut would release
        id: preview
        shell: bash
        env:
          # `releaserc.toml` declares `[semantic_release.remote] token = {env = "GH_TOKEN"}`, so the
          # environment variable name is part of the configuration, not a convention.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          # The last PUBLISHED version, which is not the same as the last tag. This job creates no
          # candidate tags any more, so the two are equal, but filtering `-rc` keeps the comparison
          # honest if a tag is ever added by hand: a comparison against `v1.0.6-rc.2` would report
          # 1.0.6 as "already released" and the preview would look permanently empty.
          last_full="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -v -- '-rc' | head -n 1)"
          if [ -z "$last_full" ]; then
            printf '::error::no published tag found; cannot tell a new version from the current one\n'
            exit 1
          fi

          # `--print` is a dry run: it computes the version and exits without writing, committing,
          # tagging, pushing or releasing. That is the whole design of this job. The output is the
          # bare version on its own line; the tool's own logging goes to stderr and is dropped so the
          # value can be used directly.
          version="$(semantic-release -c releaserc.toml version --print 2>/dev/null | tail -n 1)"

          # Comparing against the last published version is how "nothing to release" is decided,
          # rather than grepping the log for the tool's own wording. A `chore:` push leaves the
          # computed version equal to the published one, and that is a no-op, not a failure.
          if [ "$version" = "${last_full#v}" ]; then
            printf 'pending=false\n' >> "$GITHUB_OUTPUT"
            printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
            printf 'published=%s\n' "$last_full" >> "$GITHUB_OUTPUT"
            printf '::notice::nothing releasable since %s; the next cut would change nothing\n' "$last_full"
            exit 0
          fi

          printf 'pending=true\n' >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'published=%s\n' "$last_full" >> "$GITHUB_OUTPUT"

          # `towncrier build --draft` renders the changelog to stdout and writes nothing: it does
          # not touch CHANGELOG.md and it does not consume the fragments. This is the changelog the
          # cut would write, produced by the same tool and the same fragments, without a version
          # being committed anywhere.
          printf '### The next cut would release `%s`\n\n' "$version" >> "$GITHUB_STEP_SUMMARY"
          printf 'Pending since `%s`. Changelog as it would be written:\n\n' "$last_full" >> "$GITHUB_STEP_SUMMARY"
          towncrier build --config towncrier.toml --draft --version "$version" 2>/dev/null \
            | tail -n +2 >> "$GITHUB_STEP_SUMMARY"
          printf '\nFragments waiting: %s\n' \
            "$(find newsfragments -type f -name '*.md' | wc -l | tr -d ' ')" >> "$GITHUB_STEP_SUMMARY"

      # The tracking issue is the signal. It replaced the candidate tags, which had to go: a tag is a
      # release boundary as far as the changelog is concerned, and a boundary per merge is what made
      # the published v1.0.6 notes empty.
      #
      # One issue, reused. Creating a new one per push would make the list of pending work the
      # longest-read page in the repository, and the question this answers is always the same one:
      # what is waiting, and has it changed.
      - name: Report | Post the preview to the tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PENDING: ${{ steps.preview.outputs.pending }}
          VERSION: ${{ steps.preview.outputs.version }}
          PUBLISHED: ${{ steps.preview.outputs.published }}
        run: |
          set -uo pipefail
          # The label is what finds the issue. It is created here rather than assumed, because a
          # workflow that fails on a missing label is a workflow that needs a manual step before it
          # can ever work again.
          gh label create status:pendiente --color 0E8A16 \
            --description "Work accumulated on main and waiting for a cut" 2>/dev/null || true

          issue="$(gh issue list --label status:pendiente --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ "$PENDING" != "true" ]; then
            body="Nothing releasable since \`${PUBLISHED}\`. The next cut would change nothing."
          else
            body="$(printf 'A cut would release **%s**, on top of `%s`.\n\n### Changelog as it would be written\n\n' \
              "$VERSION" "$PUBLISHED"
              towncrier build --config towncrier.toml --draft --version "$VERSION" 2>/dev/null \
                | tail -n +2)"
          fi

          if [ -z "$issue" ]; then
            printf '## Pending release\n\n%s\n' "$body" \
              | gh issue create --title "Pending release" --label status:pendiente --body-file -
            printf 'opened a tracking issue for the pending work\n'
          else
            printf '%s\n' "$body" | gh issue comment "$issue" --body-file -
            printf 'recorded the preview on issue #%s\n' "$issue"
          fi

  cut:
    name: Cut release
    # The human decision, and the only path to a `vX.Y.Z` tag.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      # The single write, and it is a per-job grant because nothing else in this workflow pushes
      # anything. The preview job above holds `issues: write` instead and cannot do this.
      contents: write
    steps:
      # A cut dispatched from any other ref would compute its version from a branch that no release
      # rule matches, and the tool's answer to that is a no-op that reads like a successful cut in the
      # log. Fail loudly instead, before anything has been written.
      - name: Setup | Refuse a cut that is not on main
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            printf 'cut refused: dispatched on %s, but pending work accumulates on main\n' "${{ github.ref_name }}"
            exit 1
          fi

      - name: Setup | Checkout Repository on Release Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-tags: true

      # Same reset, same reason as the preview: the release is cut from the commit the maintainer
      # dispatched on and no later. Otherwise a merge landing mid-cut would be swept into a release
      # nobody saw before the tag existed.
      - name: Setup | Force release branch to be at workflow sha
        run: |
          git reset --hard ${{ github.sha }}

      # The action's committer inputs are not available now that this job calls the CLI directly, and
      # the release commit has to be authored by the same person they would have named — not by PSR's
      # own default, which is `semantic-release <semantic-release>`, i.e. no account at all, and not by
      # the action's documented example, which resolves to the `actions` *organization*: an identity
      # that is not a bot and is shared with every other workflow in every repository. `--local`
      # writes into this checkout's `.git/config`, which outranks the global and system config, so it
      # is the identity git resolves for the release commit.
      - name: Setup | Configure the release committer
        run: |
          git config --local user.name 'AiluraKitty'
          git config --local user.email '334750167+AiluraKitty@users.noreply.github.com'

      - name: Setup | Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Setup | Install the release toolchain
        run: |
          python -m pip install "python-semantic-release==10.7.0" "towncrier==26.9.0"

      # The changelog is written BEFORE the version is stamped, and the version is computed first so
      # towncrier can be given it. Both halves are deliberate and neither order is arbitrary:
      #
      #   1. Compute the version with `--print`, which writes nothing.
      #   2. Build the changelog with that version. towncrier rewrites CHANGELOG.md and DELETES the
      #      fragments it consumed, which is what starts the next release's accumulation.
      #   3. Stage both, and let PSR commit them via `assets` in releaserc.toml, then tag and release.
      #
      # If towncrier ran after the tag it would leave CHANGELOG.md modified in a runner that is about
      # to be discarded, and the tag would point at a commit whose changelog still describes the
      # previous release.
      - name: Cut | Write the changelog, then release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          last_full="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -v -- '-rc' | head -n 1)"
          version="$(semantic-release -c releaserc.toml version --print 2>/dev/null | tail -n 1)"

          # Refuse an empty cut rather than publishing an empty release. A cut dispatched when there
          # is nothing releasable would otherwise tag a version that already exists, and the tool
          # would report success while writing nothing — the same class of green-but-wrong run this
          # repository keeps guarding against.
          if [ "$version" = "${last_full#v}" ]; then
            printf 'cut refused: nothing releasable since %s, so %s would be a duplicate tag\n' \
              "$last_full" "$version"
            exit 1
          fi

          towncrier build --config towncrier.toml --version "$version" --yes

          # `git add -A` rather than naming the two paths: towncrier deletes fragments as well as
          # writing the changelog, and the deletions are part of the release. `assets` in
          # releaserc.toml is what makes PSR include them in the release commit.
          git add -A

          # The releaser runs after the changelog is staged, so its commit carries it. The changelog
          # it would otherwise write is suppressed with `--no-changelog`, which is the same thing the
          # action's `changelog` input did before this job stopped using the action. Two changelog
          # writers in one release is exactly the arrangement that produced an empty v1.0.6.
          semantic-release -c releaserc.toml version --no-changelog
          status=$?

          # The tool computes the version again, and it must arrive at the number towncrier already
          # wrote into the changelog. Nothing changed between the two runs, so it must; if it ever
          # does not, the published changelog would describe a version that was not released. Compare
          # rather than trust.
          tag="$(git tag --points-at HEAD | head -n 1 | tr -d '[:space:]')"
          if [ "$tag" != "v${version}" ]; then
            printf '::error::the releaser tagged %s but the changelog says v%s\n' "${tag:-<nothing>}" "$version"
            exit 1
          fi

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'link=%s\n' "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_OUTPUT"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Report | What was released
        if: always()
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          LINK: ${{ steps.release.outputs.link }}
          STATUS: ${{ steps.release.outputs.status }}
        run: |
          if [ -n "$TAG" ]; then
            printf 'cut a release: %s as %s: %s\n' "$VERSION" "$TAG" "$LINK"
          else
            printf 'no release was made (tool exit %s); see the log above and .github/RELEASING.md\n' "${STATUS:-unknown}"
          fi
