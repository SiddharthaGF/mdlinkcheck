# Python Semantic Release configuration.
#
# This file is NOT auto-discovered: PSR reads `pyproject.toml` by default, so a bare
# `semantic-release` run silently uses defaults. The workflow passes it as the action's
# `config_file`, which is the same thing as `-c releaserc.toml`; a local run must pass `-c` by hand.
#
# There is no `pyproject.toml` in this repository, on purpose: the tool is a flat module, not a
# distributed package, so there is no project version to stamp and no build backend to ask. The git
# tag is the version of record.

[semantic_release]
tag_format = "v{version}"
# Not `add_partial_tags`, which would maintain a moving `v1` and `v1.0`. It could not be verified
# offline: across four runs the exact tag was created and the partial ones never were, so it is left
# off rather than shipped on trust. Nothing adopts this repository by ref, so nothing needs the alias.
add_partial_tags = false
# `false` so the first release is 1.0.0 rather than 0.1.0. The default changed to this in PSR 10.
allow_zero_version = false
# A breaking change bumps the major even while the version is still zero.
major_on_zero = true
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
# One named group instead of relying on the implicit default list, which matches `main`, `master`,
# `next`, `dev`, `beta`, `alpha` and more. Only `main` is releasable here, and the RC run reads the
# prerelease token from whichever group matches the checked-out branch, so the group has to be
# unambiguous. A branch that matches nothing produces no version at all, which is the outcome wanted
# for a topic branch: it accumulates in a pull request, not in a tag.
[semantic_release.branches.main]
match = "main"
# `false`, the default, and it must stay that way. `prerelease = true` marks the branch as a
# prerelease branch, which makes PSR force a *new* version on every run even when nothing releasable
# landed. That is the "rc.N counts pushes" behavior, and it is exactly what the RC run must not do:
# the workflow passes `--as-prerelease` instead, which converts the normally calculated next version
# into a prerelease and, unlike `--prerelease`, leaves `NO_RELEASE` alone. A push carrying only
# `chore:` traffic therefore produces no new RC, by design.
prerelease = false
# The PSR default as well, spelled out because the promise in .github/RELEASING.md — every tag is
# `vX.Y.Z` or a prerelease of that shape — is only as good as this string. Combined with
# `tag_format = "v{version}"` above it is what makes the RC tag `v1.1.0-rc.3` and the cut tag
# `v1.1.0`, and nothing else.
prerelease_token = "rc"

[semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
# `false`, and the default, and it must stay that way. `true` makes the releaser read conventional
# prefixes out of a squash commit's *body* — and GitHub puts the branch's whole commit list in that body.
# A branch carrying more than one commit therefore donates an already-released `fix:` to whatever pull
# request was merged last, which is how v1.0.2 credited #12 for a change that was #9. Nothing needs it
# here: the repository is squash-merge only, so the subject on `main` is already the pull request title
# and already carries the prefix.
parse_squash_commits = false
# A merge commit carries no conventional subject. One would otherwise read as an empty patch.
ignore_merge_commits = true

[semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"

# Only the cut run writes this file: the RC runs pass `--no-changelog` and the cut passes
# `changelog: 'true'` on the action, so an entry is written once, on the release, and never on a
# candidate. That the cut's entry is complete rather than partial rests on a non-obvious property of
# the cut run, so the code is named: with `prerelease` false, PSR resolves `latest_version` to the
# last FULL release (say `v1.0.5`) and not to the most recent candidate
# (`semantic_release/version/algorithm.py`, the `latest_version` selection). So the cut's changelog
# spans the whole accumulation instead of only the commits after `v1.1.0-rc.3`. That same resolution
# is also why a cut cannot finalize a pending candidate, and why it absorbs commits merged after the
# newest one — one mechanism, not two facts. See .github/RELEASING.md.
[semantic_release.changelog]
# Keeps the changelog about what changed for a reader. PSR ships no exclusion patterns of its own.
exclude_commit_patterns = [
  'chore(\([^)]*\))?: .+',
  'chore\(release\): .+',
  'ci(\([^)]*\))?: .+',
  'test(\([^)]*\))?: .+',
  'style(\([^)]*\))?: .+',
  'refactor(\([^)]*\))?: .+',
]

[semantic_release.remote]
token = {env = "GH_TOKEN"}
