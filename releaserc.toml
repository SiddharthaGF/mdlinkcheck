# Python Semantic Release configuration.
#
# This file is NOT auto-discovered: PSR reads `pyproject.toml` by default, so a bare
# `semantic-release` run silently uses defaults. Both jobs in the workflow pass `-c releaserc.toml`
# by hand; a local run must pass `-c` too.
#
# There is no `pyproject.toml` in this repository, on purpose: the tool is a flat module, not a
# distributed package, so there is no project version to stamp and no build backend to ask. The git
# tag is the version of record.

[semantic_release]
tag_format = "v{version}"

# Not `add_partial_tags`, which would maintain a moving `v1` and `v1.0`. It could not be verified
# offline: across four runs the exact tag was created and the partial ones never were, so it is left
# off rather than shipped on trust. Nothing adopts this repository by ref, so nothing needs the alias.
add_partial_tags = false
# `false` so the first release is 1.0.0 rather than 0.1.0. The default changed to this in PSR 10.
allow_zero_version = false
# A breaking change bumps the major even while the version is still zero.
major_on_zero = true
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
# One named group instead of relying on the implicit default list, which matches `main`, `master`,
# `next`, `dev`, `beta`, `alpha` and more. Only `main` is releasable here, and a release has to come
# from exactly one branch, so the group has to be unambiguous. A branch that matches nothing produces
# no version at all, which is the outcome wanted for a topic branch: it accumulates in a pull
# request, not in a tag.
[semantic_release.branches.main]
match = "main"
# `false`, the default, and it must stay that way. `prerelease = true` marks the branch as a
# prerelease branch, which makes PSR force a *new* version on every run even when nothing releasable
# landed — the "rc.N counts pushes" behavior. Nothing here needs it any more: the preview job
# computes a version with `--print` and releases nothing, so there is no candidate to force. The
# setting is kept because the cut run resolves the branch, and a release group that is a prerelease
# branch would change what a cut computes.
prerelease = false
# The PSR default as well, spelled out because it is part of the tag shape this repository
# promises. Combined with `tag_format = "v{version}"` above it is the whole of what a tag can look
# like, and nothing else is created.
prerelease_token = "rc"

[semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
# `false`, and the default, and it must stay that way. `true` makes the releaser read conventional
# prefixes out of a squash commit's *body* — and GitHub puts the branch's whole commit list in that body.
# A branch carrying more than one commit therefore donates an already-released `fix:` to whatever pull
# request was merged last, which is how v1.0.2 credited #12 for a change that was #9. Nothing needs it
# here: the repository is squash-merge only, so the subject on `main` is already the pull request title
# and already carries the prefix.
parse_squash_commits = false
# A merge commit carries no conventional subject. One would otherwise read as an empty patch.
ignore_merge_commits = true

# PSR no longer writes the changelog. `towncrier` does, from the news fragments in
# `newsfragments/`, and the cut run passes `--no-changelog`. That is not a preference: PSR builds its
# changelog by walking history and opening a section at every tagged commit, so a tag is a release
# boundary, and the candidate tags were not releases the tool could distinguish. They swallowed two
# of the three commits in v1.0.6 and the published section came out empty. Towncrier never reads git
# history, so it has no boundary to get wrong. See towncrier.toml and .github/RELEASING.md.
#
# What is left below is the commit parser, which still decides the VERSION. That half of PSR's job
# is sound and is unaffected: the cut run still computes 1.0.7 from a `fix:` without being told.
#
# HOW THE TOWNCRIER WRITTEN CHANGELOG REACHES THE TAG, since it is not this file's doing
#
# It reaches it because the cut job runs `git add -A` after `towncrier build` and before the
# releaser. The releaser then commits the whole index, which is how towncrier's CHANGELOG.md and its
# deletion of the consumed fragments end up inside the `chore(release)` commit. There is deliberately
# no `assets` key here: it was tried, and it changes nothing, because `git add -A` has already staged
# everything and `git commit` commits the index rather than a path list. Listing `newsfragments`
# there only produced `WARNING Failed to add path (newsfragments) to index`, because by then the
# directory no longer exists. If the `git add -A` in `.github/workflows/release.yml` ever goes away,
# the changelog silently stops being in the release and the tag points at a commit that still
# describes the previous version. That coupling is the reason the line is commented rather than
# trusted.

[semantic_release.remote]
token = {env = "GH_TOKEN"}
